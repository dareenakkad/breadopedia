  - label: Origin point (latitude, then longitude)
    name: origin_point
    widget: list
    field:
      label: Coordinate
      name: coord
      widget: number
      value_type: float
    min: 2
    max: 2
    hint: 'Two numbers: latitude first, longitude second. This places the pin on the map.'
  - label: Also known as
    name: also_known_as
    widget: list
    required: false
    hint: Other names, comma-separated. These are searchable.
  - &id001
    label: Status
    name: status
    widget: select
    options:
    - draft
    - review
    - published
    default: draft
    hint: Only "published" appears on the site.
  - &id002
    label: Images
    name: images
    widget: list
    label_singular: Image
    summary: '{{fields.caption}}'
    required: false
    hint: The first image is the main picture shown at the top of the page. Every image needs its credit.
    fields:
    - label: File
      name: file
      widget: image
      allow_multiple: false
    - label: Caption
      name: caption
      widget: string
    - label: Licence
      name: licence
      widget: select
      options:
      - CC0
      - CC-BY
      - CC-BY-SA
      - own
      default: CC-BY-SA
    - label: Photographer / author
      name: author
      widget: string
    - label: Source link
      name: source_url
      widget: string
      pattern:
      - ^https?://
      - Must be a web address starting with http
    - label: Alt text (what the picture shows, for screen readers)
      name: alt
      widget: string
  - &id003
    label: Summary
    name: summary
    widget: text
    hint: One or two sentences, 300 characters max. Shown in lists and on the map.
    pattern:
    - ^[\s\S]{1,300}$
    - 300 characters max
  - label: Commercial-bakery video links
    name: videos_commercial
    widget: list
    required: false
    hint: YouTube links, comma-separated
  - label: Home-baking video links
    name: videos_home
    widget: list
    required: false
    hint: YouTube links, comma-separated
  - label: Affiliate product ids
    name: affiliates
    widget: list
    required: false
    hint: Ids from the Affiliates list
  - &id004
    label: Published on
    name: published_at
    widget: datetime
    required: false
    date_format: YYYY-MM-DD
    time_format: false
    format: YYYY-MM-DD
  - &id005
    label: Updated on
    name: updated_at
    widget: datetime
    required: false
    date_format: YYYY-MM-DD
    time_format: false
    format: YYYY-MM-DD
  - label: Sources (internal, never shown on the site)
    name: sources
    widget: list
    required: false
  - &id006
    label: Body
    name: body
    widget: markdown
- name: articles
  label: Articles
  label_singular: Article
  folder: content/articles
  create: true
  slug: '{{fields.slug}}'
  media_folder: /public/media/{{slug}}
  public_folder: /media/{{slug}}
  summary: '{{title}} — {{status}}'
  fields:
  - label: Title
    name: title
    widget: string
  - label: Slug (web address, lowercase, hyphens)
    name: slug
    widget: string
    pattern:
    - ^[a-z0-9-]+$
    - Lowercase letters, numbers and hyphens only
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  - *id006
- name: countries
  label: Countries
  label_singular: Country
  folder: content/countries
  create: true
  slug: '{{fields.code}}'
  media_folder: /public/media/{{code}}
  public_folder: /media/{{code}}
  sortable_fields:
  - name
  - status
  - region
  summary: '{{name}} — {{status}}'
  fields:
  - label: Country code (2 letters, lowercase)
    name: code
    widget: string
    pattern:
    - ^[a-z]{2}$
    - Two lowercase letters
  - label: Name
    name: name
    widget: string
  - label: Region
    name: region
    widget: string
  - label: Centroid (latitude, then longitude)
    name: centroid
    widget: list
    field:
      label: Coordinate
      name: coord
      widget: number
      value_type: float
    min: 2
    max: 2
  - *id002
  - *id003
  - label: Staple grains
    name: staple_grains
    widget: list
    required: false
  - *id001
  - *id004
  - *id005
  - *id006
- name: affiliates
  label: Affiliates
  files:
  - name: affiliates
    label: Recommended products
    file: content/affiliates.yaml
    fields:
    - label: Products
      name: items
      widget: list
      label_singular: Product
      summary: '{{fields.name}}'
      required: false
      fields:
      - label: Id (short, lowercase)
        name: id
        widget: string
        pattern:
        - ^[a-z0-9-]+$
        - Lowercase letters, numbers and hyphens only
      - label: Name
        name: name
        widget: string
      - label: Category
        name: category
        widget: select
        options:
        - tools
        - flours
        - books
        - ovens
      - label: Link
        name: url
        widget: string
      - label: Programme
        name: programme
        widget: string
        hint: e.g. Amazon Associates
      - label: Note
        name: note
        widget: text
