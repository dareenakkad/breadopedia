# Decap CMS — the editor at breadopedia.org/admin. Forms mirror src/content.config.ts.
backend:
  name: github
  repo: dareenakkad/breadopedia
  branch: main
  base_url: https://breadopedia-auth.dareen.workers.dev
  auth_endpoint: auth
  commit_messages:
    create: 'Add {{collection}}: {{slug}}'
    update: 'Update {{collection}}: {{slug}}'
    delete: 'Remove {{collection}}: {{slug}}'
    uploadMedia: Add image {{path}}
    deleteMedia: Remove image {{path}}
site_url: https://breadopedia.org
display_url: https://breadopedia.org
logo_url: /favicon.svg
media_folder: public/media
public_folder: /media
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
collections:
- name: breads
  label: Breads
  label_singular: Bread
  folder: content/breads
  create: true
  slug: '{{fields.slug}}'
  media_folder: /public/media/{{slug}}
  public_folder: /media/{{slug}}
  sortable_fields:
  - title
  - status
  - origin_country
  summary: '{{title}} — {{status}}'
  fields:
  - label: Title
    name: title
    widget: string
  - label: Slug (web address, lowercase, hyphens)
    name: slug
    widget: string
    pattern:
    - ^[a-z0-9-]+$
    - Lowercase letters, numbers and hyphens only
  - label: Classification
    name: taxonomy
    widget: select
    options:
    - label: Flatbreads › Unleavened › Griddle
