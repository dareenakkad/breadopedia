# Breadopedia taxonomy — the nested tree every entry sits in.
# Level 1 = class (owns a colour) · Level 2 = leavening (or pizza, inside Flatbreads) · Level 3 = method or form · Level 4 = the bread itself.
# Ids are dotted paths; an entry's `taxonomy` field points at its deepest node (level 3 here, or a level-4 node added later).
# Draft 2026-10-31 from the knowledge base facets (283 breads)..

# ---- 1 Flatbreads ---------------------------------------------------------
- id: flatbreads
  name: Flatbreads
  level: 1
  colour: "#d93a1f"
  description: Breads baked, griddled or pit-cooked flat, from unleavened chapati to leavened khobz and pizza.
- id: flatbreads.unleavened
  name: Unleavened
  parent: flatbreads
  level: 2
  description: No rise; the dough is rolled or slapped thin and cooked fast.
- id: flatbreads.unleavened.griddle
  name: Griddle
  parent: flatbreads.unleavened
  level: 3
  description: Cooked on a hot plate, saj or comal — chapati, tortilla, sajj.
- id: flatbreads.unleavened.oven-floor
  name: Oven-floor
  parent: flatbreads.unleavened
  level: 3
  description: Baked on a hearth or stone — roqaq, carta da musica.
- id: flatbreads.unleavened.pit
  name: Pit and ash
  parent: flatbreads.unleavened
  level: 3
  description: Buried in embers or sand — Bedouin breads.
- id: flatbreads.leavened
  name: Leavened
  parent: flatbreads
  level: 2
  description: Raised with yeast, levain or old dough before being baked flat.
- id: flatbreads.leavened.oven-floor
  name: Oven-floor
  parent: flatbreads.leavened
  level: 3
  description: Baked on a hearth — khobz, pita, focaccia, barbari.
- id: flatbreads.leavened.tandoor
  name: Tandoor
  parent: flatbreads.leavened
  level: 3
  description: Slapped onto the wall of a clay oven — naan, tannour.
- id: flatbreads.leavened.griddle
  name: Griddle
  parent: flatbreads.leavened
  level: 3
  description: Leavened then griddled — aish shammi, bannock, injera.
- id: flatbreads.leavened.pit
  name: Pit
  parent: flatbreads.leavened
  level: 3
  description: Leavened, then cooked in a heated pit or pot.
- id: flatbreads.pizza
  name: Pizza
  parent: flatbreads
  level: 2
  description: The leavened, topped flatbread in all its styles, from Naples to Detroit.
- id: flatbreads.pizza.neapolitan
  name: Neapolitan and Italian
  parent: flatbreads.pizza
