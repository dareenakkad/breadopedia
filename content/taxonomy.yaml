  description: Wood-fired, high heat, soft rim — Napoletana, Romana, pinsa, sfincione.
- id: flatbreads.pizza.american
  name: American styles
  parent: flatbreads.pizza
  level: 3
  description: New York, Chicago, Detroit, St. Louis, tavern, California and the rest.
- id: flatbreads.pizza.filled
  name: Folded and filled
  parent: flatbreads.pizza
  level: 3
  description: Calzone, stromboli and other closed forms.

